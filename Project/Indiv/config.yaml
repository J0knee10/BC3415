# Smishing Triage — central configuration.
# Every path, label and split parameter lives here so that nothing is hardcoded
# in the modules. Change a value here and the whole pipeline follows.

# --- Labels -------------------------------------------------------------
# Order matters: it fixes the integer encoding and the axis order of every
# confusion matrix produced by the project.
labels:
  names: [ham, spam, smishing]
  # The class the project is actually about. Recall on this class is the
  # headline metric, not overall accuracy.
  target: smishing

# --- Paths --------------------------------------------------------------
# All paths are relative to the project root (the directory holding this file).
paths:
  raw: data/raw
  processed: data/processed
  artifacts: artifacts
  reports: reports
  tessdata: tessdata     # Tesseract language data for the OCR path

# --- Data splitting -----------------------------------------------------
split:
  test_size: 0.20
  val_size: 0.15        # fraction of the remaining train pool
  random_state: 42
  stratify: true
  # Training rows whose character n-gram cosine similarity to any validation
  # or test message reaches this are dropped (see preprocess.near_duplicates).
  # Template matching alone missed paraphrased variants of held-out messages.
  near_dup_threshold: 0.7

# --- Training and selection ---------------------------------------------
train:
  # The LLM-"generated" Mendeley rows are mostly reworded copies of the other
  # corpora. They stay in train.csv so src.ablation can measure them; across
  # repeated template splits (reports/ablation_repeated.csv) they make no
  # reliable difference, so the served model trains on real messages only.
  use_synthetic: false

selection:
  # Highest validation macro F1, with smishing recall as the tiebreak, among
  # rungs that flag at most this share of the Singapore shift set (real local
  # ham). Rungs within noise of each other on macro F1 differed tenfold on
  # false alarms, which macro F1 cannot see. Added after the near-duplicate
  # fix, with the validation results in view; the test set was not used.
  max_sg_false_alarm: 0.01

# --- Text normalisation -------------------------------------------------
# Placeholder tokens replace URLs, phone numbers and money amounts. Their
# presence is predictive even when the specific value is not, so they are
# substituted rather than deleted.
normalise:
  url_token: " URLTOKEN "
  email_token: " EMAILTOKEN "
  phone_token: " PHONETOKEN "
  money_token: " MONEYTOKEN "
  number_token: " NUMTOKEN "

# --- Evaluation ---------------------------------------------------------
# Cost matrix for choosing an operating point. Rows are the true class,
# columns the predicted class, in the order given by labels.names.
# A missed smishing message is the expensive error; a marketing text flagged
# as smishing is a minor annoyance; spam left in the inbox costs nothing.
cost_matrix:
  ham:      {ham: 0, spam: 1,  smishing: 2}
  spam:     {ham: 0, spam: 0,  smishing: 1}
  smishing: {ham: 20, spam: 10, smishing: 0}

# How calibrated probabilities become a verdict.
#   argmax    the most probable class
#   min_cost  the class with the lowest expected cost under cost_matrix
# src.train scores both on validation and on the Singapore shift set and
# writes reports/operating_point_val.csv, so the choice is made with the
# evidence in view. The matrix alone prefers min_cost, but it prices a false
# scam alarm on a real message at only 2, and min_cost raises false alarms on
# Singaporean ham nearly threefold. For a checker people must trust, argmax.
operating_point: argmax

evaluate:
  # Bootstrap resamples used for confidence intervals on the smishing metrics.
  # The smishing test set is small (~100 messages), so a point estimate alone
  # would overstate precision.
  bootstrap_n: 2000
  bootstrap_alpha: 0.05
